# =============================================================================
# NuSaaS — Public Distribution (PostgreSQL)
# =============================================================================
# This file pulls pre-built, signed images from Docker Hub.
# All host dependencies have been removed for total container isolation.
#
# MANUAL:
#   1. Copy .env.selfhosted → .env and fill in your values
#   2. docker compose -f docker-compose.pgsql.yml up -d
#   3. docker compose -f docker-compose.pgsql.yml exec api php artisan migrate --force
#
# SUPPORT: support@nusaas.com | https://nusaas.com/docs
# =============================================================================

x-backend-common: &backend-common
  image: ghostdev1/nusaas-backend:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    - storage-data:/var/www/storage
    - ./firebase:/var/www/firebase:ro
  networks:
    - nusaas-network

services:
  # ---------------------------------------------------------------------------
  # REST API — FrankenPHP (Caddy + PHP 8.2)
  # ---------------------------------------------------------------------------
  api:
    <<: *backend-common
    container_name: nusaas-api
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ---------------------------------------------------------------------------
  # Background Worker
  # ---------------------------------------------------------------------------
  worker:
    <<: *backend-common
    container_name: nusaas-worker
    command: /usr/bin/supervisord -n -c /etc/supervisor/conf.d/supervisord.conf
    depends_on:
      api:
        condition: service_healthy
      cache:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Task Scheduler
  # ---------------------------------------------------------------------------
  cron:
    <<: *backend-common
    container_name: nusaas-cron
    command: >
      /bin/sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    depends_on:
      - cache

  # ---------------------------------------------------------------------------
  # WebSocket Server
  # ---------------------------------------------------------------------------
  ws:
    <<: *backend-common
    container_name: nusaas-ws
    ports:
      - "${REVERB_PORT:-8083}:8083"
    command: php artisan reverb:start --host=0.0.0.0 --port=8083
    depends_on:
      - cache

  # ---------------------------------------------------------------------------
  # Frontend Web App
  # ---------------------------------------------------------------------------
  web:
    image: ghostdev1/nusaas-frontend:latest
    container_name: nusaas-web
    restart: unless-stopped
    env_file: web/.env.frontend
    ports:
      - "${FRONTEND_PORT:-4001}:4001"
    networks:
      - nusaas-network
    depends_on:
      api:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Database — PostgreSQL 15
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: nusaas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nusaas}
      POSTGRES_USER: ${DB_USERNAME:-nusaas}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - nusaas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nusaas} -d ${DB_DATABASE:-nusaas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cache & Queue Broker — Redis 7
  # ---------------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: nusaas-cache
    restart: unless-stopped
    command: >
      redis-server
        --appendonly yes
        --maxmemory ${REDIS_MAXMEMORY:-512mb}
        --maxmemory-policy allkeys-lru
    volumes:
      - cache-data:/data
    networks:
      - nusaas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Search Engine — Meilisearch
  # ---------------------------------------------------------------------------
  search:
    image: getmeili/meilisearch:v1.12
    container_name: nusaas-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - search-data:/meili_data
    networks:
      - nusaas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 3

# =============================================================================
# Infrastructure
# =============================================================================
networks:
  nusaas-network:
    driver: bridge

volumes:
  db-data:
  cache-data:
  storage-data:
  search-data:
