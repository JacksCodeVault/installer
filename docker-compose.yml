# NuSaaS self-hosted stack. Documentation remains hosted at https://docs.nusaas.com.
# Application images are pinned through NUSAAS_VERSION; updates are user initiated.

x-backend-common: &backend-common
  image: ghostdev1/nusaas-backend:${NUSAAS_VERSION:?Set NUSAAS_VERSION in .env}
  restart: unless-stopped
  env_file: .env
  volumes:
    - storage-data:/var/www/storage
    - ./firebase:/var/www/firebase:ro
  networks: [nusaas-network]

services:
  proxy:
    image: caddy:2.11.7-alpine
    container_name: nusaas-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [nusaas-network]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  api:
    <<: *backend-common
    container_name: nusaas-api
    depends_on:
      db: { condition: service_healthy }
      cache: { condition: service_healthy }
      search: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  worker:
    <<: *backend-common
    container_name: nusaas-worker
    command: /usr/local/bin/bootstrap-runtime.sh /usr/bin/supervisord -n -c /etc/supervisor/conf.d/supervisord.conf
    depends_on:
      api: { condition: service_healthy }
      cache: { condition: service_healthy }

  cron:
    <<: *backend-common
    container_name: nusaas-cron
    command: >
      /usr/local/bin/bootstrap-runtime.sh /bin/sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    depends_on: [cache]

  ws:
    <<: *backend-common
    container_name: nusaas-ws
    command: /usr/local/bin/bootstrap-runtime.sh php artisan reverb:start --host=0.0.0.0 --port=8083
    depends_on: [cache]

  web:
    image: ghostdev1/nusaas-frontend:${NUSAAS_VERSION:?Set NUSAAS_VERSION in .env}
    container_name: nusaas-web
    restart: unless-stopped
    env_file: web/.env.frontend
    networks: [nusaas-network]
    depends_on:
      api: { condition: service_healthy }

  db:
    image: mysql:8.0.46
    container_name: nusaas-db
    restart: unless-stopped
    command: --ssl=0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [db-data:/var/lib/mysql]
    networks: [nusaas-network]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7.4.11-alpine
    container_name: nusaas-cache
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy allkeys-lru
    volumes: [cache-data:/data]
    networks: [nusaas-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  search:
    image: getmeili/[REDACTED]:v1.12
    container_name: nusaas-[REDACTED]
    restart: unless-stopped
    environment:
      MEILI_ENV: "[REDACTED]"
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?Set MEILISEARCH_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
    volumes: [search-data:/meili_data]
    networks: [nusaas-network]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  nusaas-network: { driver: bridge }

volumes:
  db-data:
  cache-data:
  storage-data:
  search-data:
  caddy-data:
  caddy-config:
